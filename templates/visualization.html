<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맵 시각화 및 조작 패널</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styles */
        .visualization-container {
            max-width: 1600px; /* Overall container for 900px map + 700px panel */
            margin-left: auto;
            margin-right: auto;
        }

        #myCanvas {
            border: 1px solid black;
            display: block; /* Prevents bottom margin/space */
        }

        #coordinates {
            margin-top: 8px;
            font-family: Arial, sans-serif;
        }

        #map-area {
            /* col-lg-auto will size this based on the 900px canvas */
        }

        #panel-area {
            /* This column (col-lg) will take up remaining space.
               If .visualization-container is 1600px and map-area is 900px, this gets 700px. */
        }

        #controlPanel {
            height: 900px;
            border: 1px solid #dee2e6; /* Bootstrap subtle border */
            padding: 15px;
            background-color: #f8f9fa; /* Light background */
            box-sizing: border-box;
            width: 100%; /* Fill its column */
        }

        #controlPanel img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive adjustments for stacking columns below lg breakpoint */
        @media (max-width: 991.98px) {
            #map-area {
                margin-bottom: 1rem; /* Space between stacked map and panel */
                overflow-x: auto; /* Ensure canvas can be scrolled if viewport is too narrow */
                display: flex; /* Used to center the canvas */
                justify-content: center; /* Center the canvas if map-area is wider than canvas */
            }
            #panel-area {
                /* Panel will naturally take full width when stacked */
            }
            #controlPanel {
                height: auto; /* Allow height to adjust to content when stacked */
            }
            #coordinates {
                text-align: center; /* Center coordinates text when stacked */
            }
        }
    </style>
</head>
<body>
    <div class="container visualization-container mt-3">
        <div class="row">
            <!-- Left Column: Map Area -->
            <div class="col-lg-auto" id="map-area">
                <canvas id="myCanvas" width="900" height="900"></canvas>
                <div id="coordinates" class="text-lg-start">클릭한 좌표: (x: 0, z: 0)</div>
            </div>

            <!-- Right Column: Control Panel Area -->
            <div class="col-lg" id="panel-area">
                <div id="controlPanel">
                    <div class="image-container">
                    <img id="controlImage" src="{{ url_for('static', filename='source/temp_image.jpg') }}" alt="Simulator Image" style="width: 100%; max-height: 500px; object-fit: contain;">
                    <div class="loading-spinner" style="display: none;">Loading...</div>
                </div>
                <h4>조작 패널</h4>
                <!-- 맵 선택 버튼 그룹 -->
                <div class="btn-group mb-3" role="group" aria-label="Map selection">
                    <button type="button" class="btn btn-outline-primary map-btn" data-map="mountain.png">Mountain</button>
                    <button type="button" class="btn btn-outline-primary map-btn" data-map="country_road.png">Country road</button>
                    <button type="button" class="btn btn-outline-primary map-btn" data-map="wilderness_dry.png">Wilderness dry</button>
                    <button type="button" class="btn btn-outline-primary map-btn" data-map="simple_flat.png">Simple flat</button>
                </div>
                <!-- 동작 버튼 그룹 -->
                <div>
                <button type="button" class="btn btn-primary w-100 mb-2">동작 1</button>
                <button type="button" class="btn btn-secondary w-100">동작 2</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const coordDisplay = document.getElementById('coordinates');

        // 맵 이미지 목록
        const mapImages = [
            { name: 'map1', src: '../static/source/mountain.png' },
            { name: 'map2', src: '../static/source/country_road.png' },
            { name: 'map3', src: '../static/source/wilderness_dry.png' },
            { name: 'map4', src: '../static/source/simple_flat.png' },
        ];
        // 현재 선택된 맵 이미지
        let currentMapImage = new Image();
        currentMapImage.src = mapImages[0].src; // 초기 맵

        // 이미지 로드
        const img = new Image();
        const img2 = new Image();
        img.src = '../static/source/simple_flat.png'; // 맵 이미지
        img2.src = 'https://cdn-icons-png.flaticon.com/512/854/854884.png';

        // 캔버스 그리기 함수
        function drawCanvas(data) {
            const { sensor_data, destination_data, enemy_data, trail } = data;
            const m_x = sensor_data['x'];
            const m_z = sensor_data['z'];
            const e_x = sensor_data['e_x'];
            const e_z = sensor_data['e_z'];
            const d_x = destination_data['d_x'];
            const d_z = destination_data['d_z'];

            console.log(m_x, m_z, e_x, e_z, d_x, d_z)

            // 캔버스 초기화
            ctx.clearRect(0, 0, 900, 900);
            ctx.drawImage(currentMapImage, 0, 0, 900, 900);
            ctx.strokeStyle = 'black';
            ctx.strokeRect(0, 0, 900, 900);

            // 플레이어 (파란색)
            ctx.fillStyle = 'blue';
            ctx.fillRect(m_x * 3, 900 - m_z * 3, 20, 20);

            // 적 (빨간색)
            ctx.fillStyle = 'red';
            ctx.fillRect(e_x * 3, 900 - e_z * 3, 20, 20);

            // 목적지 (깃발)
            if (d_x !== null && d_z !== null) {
                ctx.drawImage(img2, d_x * 3, 900 - d_z * 3, 30, 30);
            }

            // 이동 경로 (녹색 점)
            trail.forEach(element => {
                ctx.fillStyle = 'green';
                ctx.fillRect(element[0] * 3, 900 - element[1] * 3, 5, 5);
            });
        }

        // 초기 데이터로 캔버스 그리기
        img.onload = function () {
            // 초기 데이터 가져오기
            fetch('http://localhost:5055/api/data')
                .then(response => response.json())
                .then(data => {
                    drawCanvas(data);
                    // 주기적 갱신 시작
                    setInterval(() => {
                        fetch('http://localhost:5055/api/data')
                            .then(response => response.json())
                            .then(data => drawCanvas(data))
                            .catch(error => console.error('Error:', error));
                    }, 500);
                })
                .catch(error => console.error('Error:', error));
        };

        img.onerror = function () {
            console.error('이미지 로드 실패');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, 900, 900);
            ctx.strokeStyle = 'black';
            ctx.strokeRect(0, 0, 900, 900);
        };

        // 좌클릭 이벤트
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.round(event.clientX - rect.left);
            const z = Math.round(event.clientY - rect.top);
            if (event.button === 0) {
                const xNew = x / 3;
                const zNew = z / 3;
                coordDisplay.textContent = `(x: ${xNew.toFixed(1)}, z: ${zNew.toFixed(1)})`;
            }
        });

        // 우클릭 이벤트
        canvas.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = Math.round(event.clientX - rect.left);
            const z = Math.round(event.clientY - rect.top);
            const xNew = x / 3;
            const zNew = z / 3;
            coordDisplay.textContent = `move (x: ${xNew.toFixed(1)}, z: ${zNew.toFixed(1)})`;
            const coord = { 'x': xNew, 'z': zNew };

            fetch('http://localhost:5055/update_goal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(coord),
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Goal updated:', data);
                    // 즉시 캔버스 갱신
                    fetch('http://localhost:5055/api/data')
                        .then(response => response.json())
                        .then(data => drawCanvas(data))
                        .catch(error => console.error('Error:', error));
                })
                .catch(error => console.error('Error:', error));
        });

        // 맵 선택 버튼 이벤트
        document.querySelectorAll('.map-btn').forEach(button => {
            button.addEventListener('click', () => {
                const mapSrc = button.getAttribute('data-map');
                changeMap(`/static/source/${mapSrc}`);
                // 선택된 버튼 강조 (옵션)
                document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            });
        });

        const controlPanelImg = document.querySelector('#controlPanel img');

        // 이미지 갱신 함수
        function updateControlPanelImage() {
            const timestamp = new Date().getTime(); // 캐싱 방지용 타임스탬프
            controlPanelImg.src = `/static/source/temp_image.jpg?t=${timestamp}`;
        }

        // 0.5초마다 이미지 갱신
        setInterval(updateControlPanelImage, 250);

        // 초기 이미지 로드
        updateControlPanelImage();

        // 맵 변경 함수
        function changeMap(mapSrc) {
            const newMapImage = new Image();
            newMapImage.src = mapSrc;
            newMapImage.onload = () => {
                currentMapImage = newMapImage; // 새로운 맵 이미지로 교체
                // 현재 데이터로 즉시 캔버스 갱신
                fetch('http://localhost:5055/api/data')
                    .then(response => {
                        if (!response.ok) throw new Error('데이터 가져오기 실패');
                        return response.json();
                    })
                    .then(data => {
                        drawCanvas(data);
                    })
                    .catch(error => console.error('Error:', error));
            };
            newMapImage.onerror = () => {
                console.error('맵 이미지 로드 실패:', mapSrc);
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, 900, 900);
                ctx.strokeStyle = 'black';
                ctx.strokeRect(0, 0, 900, 900);
            };
        }
    </script>
</body>
</html>
